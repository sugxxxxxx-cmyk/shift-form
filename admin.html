
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シフト管理 | Virgo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#202b3a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:#131c2d;color:#fff;padding:17px 16px}
header h1{font-size:20px;margin:0}
header small{font-size:11px;color:#b9c5d5}
nav{display:flex;background:#fff;border-bottom:1px solid #e2e7ef}
nav a{flex:1;text-align:center;text-decoration:none;color:#667085;padding:15px 4px;font-size:13px;font-weight:bold}
nav a.active{color:#087a4a;border-bottom:3px solid #087a4a}
main{max-width:1050px;margin:auto}
.week{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px;gap:10px}
.week strong{font-size:17px}
button{background:#fff;border:1px solid #dce2eb;border-radius:9px;padding:11px;font-size:14px;cursor:pointer}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.metric{background:#fff;border-radius:12px;text-align:center;padding:15px 5px}
.metric span{display:block;font-size:12px;color:#667085}
.metric b{display:block;font-size:27px;margin-top:5px}
.section{background:#fff;margin:12px;border-radius:12px;padding:16px}
.section h2{font-size:17px;margin:0 0 12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f4;gap:10px}
.row:last-child{border:0}
.badge{border-radius:20px;padding:6px 10px;font-size:12px;font-weight:bold}
.done{background:#d8f8e5;color:#087a3f}
.missing{background:#ffe3e5;color:#d33b48}
input,select{border:1px solid #dce2eb;border-radius:8px;padding:10px;font-size:15px;max-width:100%}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.controls input{flex:1;min-width:140px}
.edit-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.edit-row label{font-size:12px;color:#667085}
.edit-row select,.edit-row input{width:100%;margin-top:5px}
.primary{background:#087a4a;color:#fff;border:0;font-weight:bold}
.note{font-size:12px;color:#737e8e;line-height:1.7;padding:0 16px 20px}
@media(max-width:600px){
 .edit-row{grid-template-columns:1fr}
 .week strong{font-size:14px}
}
</style>
</head>
<body>
<header>
<h1>キャストシフト管理</h1>
<small>Virgo Shift Manager ・ DEMO</small>
</header>

<nav>
<a href="shift-view.html">シフト一覧</a>
<a href="admin.html" class="active">シフト管理</a>
<a href="staff.html">スタッフ管理</a>
</nav>

<main>
<div class="week">
<button onclick="changeWeek(-1)">◀</button>
<div style="text-align:center">
<strong id="weekTitle"></strong>
<div><button onclick="goThisWeek()" style="padding:5px 10px;margin-top:5px;font-size:12px">今週</button></div>
</div>
<button onclick="changeWeek(1)">▶</button>
</div>

<div class="summary">
<div class="metric"><span>登録人数</span><b id="total">0</b></div>
<div class="metric"><span>提出済み</span><b id="done" style="color:#087a4a">0</b></div>
<div class="metric"><span>未提出</span><b id="missing" style="color:#dc4450">0</b></div>
</div>

<div class="section">
<h2>提出状況</h2>
<div class="controls">
<input id="search" placeholder="キャスト名で検索" oninput="render()">
<button id="filter" onclick="toggleFilter()">未提出のみ</button>
</div>
<div id="submissionList"></div>
</div>

<div class="section">
<h2>シフト修正（デモ）</h2>
<p style="font-size:13px;color:#667085">
キャスト・曜日・時間を選んで修正できます。
</p>
<div class="edit-row">
<div>
<label>キャスト</label>
<select id="cast"></select>
</div>
<div>
<label>曜日</label>
<select id="day">
<option value="0">月曜日</option>
<option value="1">火曜日</option>
<option value="2">水曜日</option>
<option value="3">木曜日</option>
<option value="4">金曜日</option>
<option value="5">土曜日</option>
</select>
</div>
<div>
<label>出勤時間</label>
<select id="time">
<option value="21:00">21:00</option>
<option value="21:30">21:30</option>
<option value="22:00">22:00</option>
<option value="22:30">22:30</option>
<option value="23:00">23:00</option>
<option value="休み">休み</option>
</select>
</div>
</div>
<button class="primary" onclick="saveShift()">この内容で修正</button>
<p id="message" style="font-size:13px;color:#087a4a"></p>
</div>

<p class="note">
※ 架空データを使用したデモです。<br>
※ 修正はこのページ内の表示だけに反映され、スプレッドシートやシフト一覧ページには保存されません。<br>
※ 実際のキャスト情報とは接続していません。
</p>
</main>

<script>
const names=[
'さくら','花子','美咲','あかり','ゆい','りな',
'みお','れいな','なな','ひなた','あおい','あすか'
];
const baseSamples=[
['21:00','21:00','休み','22:00','21:00','21:30'],
['休み','21:30','21:00','21:00','22:00','21:00'],
['22:00','休み','21:00','21:30','21:00','休み'],
null,
['21:30','22:00','休み','21:00','21:00','21:30'],
null,
['21:00','21:00','21:30','休み','22:00','21:00'],
['休み','22:00','21:00','21:30','21:00','22:00'],
null,
['21:00','21:30','休み','21:00','21:00','21:00'],
['21:00','休み','22:30','21:00','21:30','休み'],
['22:00','21:00','21:30','休み','21:00','22:30']
];
let samples=baseSamples.map(s=>s?[...s]:null);
let weekOffset=0;
let onlyMissing=false;

function mondayOfWeek(offset){
 const d=new Date();
 d.setHours(12,0,0,0);
 d.setDate(d.getDate()-(d.getDay()+6)%7+offset*7);
 return d;
}
function dateText(d){
 return (d.getMonth()+1)+'/'+d.getDate();
}
function changeWeek(n){weekOffset+=n;render()}
function goThisWeek(){weekOffset=0;render()}
function toggleFilter(){
 onlyMissing=!onlyMissing;
 document.getElementById('filter').textContent=
 onlyMissing?'全員表示':'未提出のみ';
 render();
}
function render(){
 const mon=mondayOfWeek(weekOffset);
 const sat=new Date(mon);
 sat.setDate(mon.getDate()+5);
 document.getElementById('weekTitle').textContent=
 dateText(mon)+' 〜 '+dateText(sat);

 document.getElementById('total').textContent=names.length;
 const submitted=samples.filter(s=>s!==null).length;
 document.getElementById('done').textContent=submitted;
 document.getElementById('missing').textContent=names.length-submitted;

 const query=document.getElementById('search').value.trim();
 let html='';
 names.forEach((name,i)=>{
  const shift=samples[i];
  if(onlyMissing&&shift!==null)return;
  if(!name.includes(query))return;
  html+='<div class="row"><strong>'+name+'</strong>'+
   '<span class="badge '+(shift?'done':'missing')+'">'+
   (shift?'提出済み':'未提出')+'</span></div>';
 });
 document.getElementById('submissionList').innerHTML=
 html||'<p>該当するキャストがいません</p>';
}

function saveShift(){
 const i=Number(document.getElementById('cast').value);
 const day=Number(document.getElementById('day').value);
 const time=document.getElementById('time').value;
 if(!samples[i])samples[i]=Array(6).fill('休み');
 samples[i][day]=time;
 document.getElementById('message').textContent=
 names[i]+'のシフトを修正しました（デモ）';
 render();
}

document.getElementById('cast').innerHTML=
 names.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('');
render();
</script>
</body>
</html>
