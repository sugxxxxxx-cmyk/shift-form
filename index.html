<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE連携申請</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #f5f6f8;
      font-family: -apple-system, sans-serif;
      color: #222;
    }
    .card {
      max-width: 480px;
      margin: 30px auto;
      padding: 28px 20px;
      background: white;
      border-radius: 16px;
    }
    h2 { text-align: center; margin-top: 0; }
    .status {
      padding: 12px;
      background: #f2f4f7;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border: 0;
      border-radius: 8px;
      background: #06c755;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .note {
      margin-top: 16px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>LINE連携申請</h2>

    <div id="status" class="status">
      LINE認証を確認中...
    </div>

    <label for="castName">源氏名</label>
    <input id="castName" type="text"
           maxlength="50"
           placeholder="例：さくら"
           autocomplete="off">

    <button id="submit" type="button" disabled>
      連携申請する
    </button>

    <p id="result" class="note">
      管理者の承認後にLINE連携が完了します。
    </p>
  </div>

  <script>
    const LIFF_ID = '2012188437-CoSEkbeN';

    // Apps ScriptのウェブアプリURL
    const API_URL =
      'https://script.google.com/macros/s/AKfycbzp3OJOz1hJfg-9fVt2FHGsDj1aCqGgww4mzQzgBRbulxp_kE2FQH8B-EkDK9AeyZ42/exec';

    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const submitButton = document.getElementById('submit');

    async function start() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          statusEl.textContent = 'LINEログインが必要です';
          return;
        }

        const profile = await liff.getProfile();

        statusEl.textContent =
          'LINE認証済み：' + profile.displayName;

        submitButton.disabled = false;

      } catch (error) {
        statusEl.textContent =
          'LINE認証エラー：' + error.message;
      }
    }

    submitButton.addEventListener('click', async () => {
      const castName =
        document.getElementById('castName').value.trim();

      if (!castName) {
        resultEl.textContent = '源氏名を入力してください';
        return;
      }

      const idToken = liff.getIDToken();

      if (!idToken) {
        resultEl.textContent =
          'LINE認証情報を取得できませんでした';
        return;
      }

      submitButton.disabled = true;
      resultEl.textContent = '申請を送信中...';

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain'
          },
          body: JSON.stringify({
            action: 'requestLineLink',
            castName: castName,
            idToken: idToken
          })
        });

        resultEl.textContent =
          '送信処理を実行しました。受付結果は管理者に確認してください。';

      } catch (error) {
        resultEl.textContent =
          '送信エラー：' + error.message;
      } finally {
        submitButton.disabled = false;
      }
    });

    start();
  </script>
</body>
</html>
