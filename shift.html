
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>週間シフト提出 | Virgo</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 14px;
  background: #f5f6f8;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.card {
  max-width: 480px;
  margin: 15px auto;
  padding: 24px 18px;
  background: white;
  border-radius: 18px;
}

h2 {
  text-align: center;
}

.status {
  padding: 14px;
  background: #f1f3f6;
  border-radius: 10px;
  text-align: center;
  margin-bottom: 16px;
}

.notice {
  padding: 13px;
  background: #eaf8ef;
  color: #19653a;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 14px;
}

.saved-notice {
  display: none;
  padding: 13px;
  margin-bottom: 14px;
  background: #e8f4ff;
  color: #165c92;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.6;
}

.day {
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

.day label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

select {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: white;
}

select:disabled {
  background: #f1f3f6;
  color: #777;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 22px;
  background: #06c755;
  border: 0;
  border-radius: 10px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #ccc;
  cursor: not-allowed;
}

#result {
  white-space: pre-line;
  line-height: 1.8;
  font-size: 14px;
}

.success {
  color: #087a4a;
  font-weight: bold;
}

.error {
  color: #d33b48;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>週間シフト提出</h2>

  <div id="status" class="status">
    LINE認証を確認中...
  </div>

  <div class="notice">
    翌週のシフトは水曜日までに提出をお願いします。
  </div>

  <div id="savedNotice" class="saved-notice"></div>

  <div id="week"></div>

  <button id="submit" disabled>
    読み込み中...
  </button>

  <p id="result" role="status" aria-live="polite"></p>
</div>

<script>
const LIFF_ID = "2012188437-eiZISGvR";

const SUPABASE_URL =
  "https://krfzidbqoyhmkeylvneh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_4W4TXn_pvYcoLxJIwzbb2A_vRMvUbp5";

const API_URL =
  SUPABASE_URL + "/functions/v1/virgo-line-shift";

const statusEl = document.getElementById("status");
const weekEl = document.getElementById("week");
const submitBtn = document.getElementById("submit");
const resultEl = document.getElementById("result");
const savedNoticeEl =
  document.getElementById("savedNotice");

const choices = [
  "休み",
  "21:00",
  "21:30",
  "22:00",
  "22:30",
  "23:00"
];

const weekdays = [
  "日", "月", "火", "水", "木", "金", "土"
];

const dates = [];

let sending = false;
let ready = false;
let hasSavedShifts = false;
let loadedValues = [];

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;
}

function makeWeek() {
  const today = new Date();

  const daysUntilNextMonday =
    (8 - today.getDay()) % 7 || 7;

  const monday = new Date(
    today.getFullYear(),
    today.getMonth(),
    today.getDate() + daysUntilNextMonday,
    12
  );

  for (let i = 0; i < 6; i++) {
    const date = new Date(
      monday.getFullYear(),
      monday.getMonth(),
      monday.getDate() + i,
      12
    );

    dates.push(formatDate(date));

    const div = document.createElement("div");
    div.className = "day";

    const label = document.createElement("label");
    label.htmlFor = "shift" + i;

    label.textContent =
      `${date.getMonth() + 1}/${date.getDate()}` +
      `（${weekdays[date.getDay()]}）`;

    const select = document.createElement("select");
    select.id = "shift" + i;
    select.disabled = true;

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "選択してください";
    select.appendChild(placeholder);

    choices.forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });

    div.appendChild(label);
    div.appendChild(select);
    weekEl.appendChild(div);
  }
}

function setControlsEnabled(enabled) {
  ready = enabled;

  dates.forEach((_, i) => {
    document.getElementById(
      "shift" + i
    ).disabled = !enabled;
  });

  submitBtn.disabled = !enabled || sending;

  if (!sending) {
    submitBtn.textContent = hasSavedShifts
      ? "変更したシフトを再提出する"
      : "シフトを提出する";
  }
}

function getShifts() {
  return dates.map((date, i) => ({
    date,
    time: document.getElementById(
      "shift" + i
    ).value
  }));
}

function showResult(message, success) {
  resultEl.textContent = message;
  resultEl.className = success ? "success" : "error";
}

async function callApi(body) {
  const controller = new AbortController();

  const timeout = setTimeout(() => {
    controller.abort();
  }, 20000);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLISHABLE_KEY
      },
      body: JSON.stringify(body),
      signal: controller.signal
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(
        result.message || "通信に失敗しました"
      );
    }

    return result;

  } finally {
    clearTimeout(timeout);
  }
}

async function loadPreviousShifts() {
  const idToken = liff.getIDToken();

  if (!idToken) {
    throw new Error(
      "LINE認証情報を取得できませんでした"
    );
  }

  statusEl.textContent =
    "前回のシフトを読み込んでいます...";

  const result = await callApi({
    action: "load",
    idToken,
    week: dates[0]
  });

  const savedShifts = result.shifts;

  if (!Array.isArray(savedShifts)) {
    throw new Error(
      "シフトの読み込み結果が不正です"
    );
  }

  const savedMap = new Map();

  for (const shift of savedShifts) {
    if (
      !shift ||
      !dates.includes(shift.date) ||
      !choices.includes(shift.time) ||
      savedMap.has(shift.date)
    ) {
      throw new Error(
        "保存済みシフトに不正なデータがあります"
      );
    }

    savedMap.set(shift.date, shift.time);
  }

  hasSavedShifts = savedMap.size > 0;

  dates.forEach((date, i) => {
    const select = document.getElementById(
      "shift" + i
    );

    select.value = savedMap.get(date) || "";
  });

  loadedValues = getShifts().map(s => s.time);

  if (hasSavedShifts) {
    savedNoticeEl.style.display = "block";

    if (savedMap.size === 6) {
      savedNoticeEl.textContent =
        "前回提出したシフトを表示しています。" +
        "変更したい日だけ修正して再提出できます。";
    } else {
      savedNoticeEl.textContent =
        "保存済みのシフトを一部読み込みました。" +
        "未入力の日を選択してから提出してください。";
    }

  } else {
    savedNoticeEl.style.display = "none";
  }

  return result;
}

async function start() {
  makeWeek();

  try {
    await Promise.race([
      liff.init({ liffId: LIFF_ID }),
      new Promise((_, reject) => {
        setTimeout(() => {
          reject(new Error("認証タイムアウト"));
        }, 10000);
      })
    ]);

    if (!liff.isLoggedIn()) {
      statusEl.textContent =
        "LINEログインが必要です";

      liff.login({
        redirectUri: window.location.href
      });

      return;
    }

    const profile = await liff.getProfile();

    if (!liff.getIDToken()) {
      throw new Error(
        "LINE IDトークンを取得できません"
      );
    }

    const result = await loadPreviousShifts();

    statusEl.textContent =
      "LINE認証済み：" + result.castName;

    setControlsEnabled(true);

  } catch (error) {
    statusEl.textContent =
      "読み込みエラー：" + error.message;

    showResult(
      "安全のため提出を停止しています。" +
      "画面を開き直してください。",
      false
    );

    setControlsEnabled(false);
  }
}

async function submitShifts() {
  if (sending || !ready) return;

  const shifts = getShifts();

  if (shifts.some(s => !s.time)) {
    showResult(
      "月曜日から土曜日まで、6日分すべて選択してください。",
      false
    );
    return;
  }

  const unchanged =
    hasSavedShifts &&
    shifts.every(
      (shift, i) => shift.time === loadedValues[i]
    );

  if (unchanged) {
    showResult(
      "前回のシフトから変更されていません。" +
      "変更したい日を選択してください。",
      false
    );
    return;
  }

  const summary = shifts
    .map(s => s.date + "：" + s.time)
    .join("\n");

  if (!confirm(
    "この内容でシフトを提出しますか？\n\n" +
    summary
  )) {
    return;
  }

  const idToken = liff.getIDToken();

  if (!idToken) {
    showResult(
      "LINE認証情報を取得できませんでした。" +
      "画面を開き直してください。",
      false
    );
    return;
  }

  sending = true;
  submitBtn.disabled = true;
  submitBtn.textContent = "送信中...";
  showResult("Supabaseに保存しています...", true);

  try {
    const result = await callApi({
      action: "save",
      idToken,
      shifts
    });

    hasSavedShifts = true;
    loadedValues = shifts.map(s => s.time);

    savedNoticeEl.style.display = "block";
    savedNoticeEl.textContent =
      "保存済みのシフトを表示しています。" +
      "変更したい日だけ修正して再提出できます。";

    showResult(
      "シフト提出完了！\n\n" +
      "キャスト：" + result.castName + "\n" +
      "6日分を保存しました。\n\n" +
      summary,
      true
    );

  } catch (error) {
    showResult(
      "シフトを保存できませんでした。\n" +
      error.message,
      false
    );

  } finally {
    sending = false;
    setControlsEnabled(true);
  }
}

submitBtn.addEventListener(
  "click",
  submitShifts
);

start();
</script>

</body>
</html>
