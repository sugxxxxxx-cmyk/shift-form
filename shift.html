
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>週間シフト提出 | Virgo</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px 14px;
  background: #f5f6f8;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
.card {
  max-width: 480px;
  margin: 15px auto;
  padding: 24px 18px;
  background: white;
  border-radius: 18px;
}
h2 { text-align: center; }
.status {
  padding: 14px;
  background: #f1f3f6;
  border-radius: 10px;
  text-align: center;
  margin-bottom: 16px;
  line-height: 1.6;
}
.notice {
  padding: 13px;
  background: #eaf8ef;
  color: #19653a;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 14px;
}
.saved-notice {
  display: none;
  padding: 13px;
  margin-bottom: 14px;
  background: #e8f4ff;
  color: #165c92;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.6;
}
.day {
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}
.day > label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}
select, input, textarea {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: white;
  font-family: inherit;
}
select:disabled, input:disabled, textarea:disabled {
  background: #f1f3f6;
  color: #777;
}
button {
  width: 100%;
  padding: 16px;
  margin-top: 22px;
  background: #06c755;
  border: 0;
  border-radius: 10px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  background: #ccc;
  cursor: not-allowed;
}
.secondary-button {
  background: #eef1f4;
  color: #333;
  margin-top: 12px;
}
#result, #linkResult {
  white-space: pre-line;
  line-height: 1.8;
  font-size: 14px;
}
.success {
  color: #087a4a;
  font-weight: bold;
}
.error {
  color: #d33b48;
  font-weight: bold;
}
.hidden { display: none !important; }
.link-box {
  padding: 18px;
  background: #f7f9fb;
  border-radius: 14px;
}
.link-box h3 {
  margin-top: 0;
  text-align: center;
}
.link-box p {
  font-size: 14px;
  line-height: 1.7;
}
.link-box label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}
.pending {
  background: #fff8e5;
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  line-height: 1.8;
}
.pending strong { color: #996600; }
.small {
  font-size: 12px;
  color: #777;
  line-height: 1.6;
}
.douhan-details {
  margin-top: 12px;
  padding: 16px;
  border: 1px solid #ccebd7;
  border-radius: 12px;
  background: #f5fcf7;
}
.douhan-title {
  font-weight: 700;
  color: #19653a;
  margin-bottom: 12px;
}
.douhan-details label {
  display: block;
  font-weight: 600;
  margin-top: 14px;
  margin-bottom: 6px;
  font-size: 14px;
}
.douhan-details label:first-child { margin-top: 0; }
.douhan-hint {
  font-size: 12px;
  color: #617064;
  margin-top: 10px;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="card">
  <h2>週間シフト提出</h2>

  <div id="status" class="status">
    LINE認証を確認中...
  </div>

  <section id="linkSection" class="hidden">
    <div class="link-box">
      <h3>個人LINE連携</h3>
      <p>
        初回のみ、お店に登録している
        キャスト名を入力してください。
      </p>

      <label for="castName">キャスト名</label>
      <input
        id="castName"
        type="text"
        maxlength="60"
        autocomplete="off"
        placeholder="例：あおい"
      >

      <button id="linkButton" type="button">
        LINE連携を申請する
      </button>

      <p class="small">
        申請後、管理者が本人確認を行います。
        承認後にシフト提出が可能になります。
      </p>

      <p id="linkResult" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="pendingSection" class="hidden">
    <div class="pending">
      <strong>LINE連携の承認待ちです</strong>
      <p>
        申請したキャスト名：<br>
        <strong id="pendingName"></strong>
      </p>
      <p>
        管理者の承認後に
        シフト提出ができるようになります。
      </p>
    </div>

    <button
      id="checkButton"
      type="button"
      class="secondary-button"
    >
      承認状況を確認する
    </button>
  </section>

  <section id="shiftSection" class="hidden">
    <div class="notice">
      翌週のシフトは水曜日までに提出をお願いします。
    </div>

    <div id="savedNotice" class="saved-notice"></div>
    <div id="week"></div>

    <button id="submit" type="button" disabled>
      読み込み中...
    </button>

    <p id="result" role="status" aria-live="polite"></p>
  </section>
</div>

<script>
const LIFF_ID = "2012188437-eiZISGvR";

const SUPABASE_URL =
  "https://krfzidbqoyhmkeylvneh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_4W4TXn_pvYcoLxJIwzbb2A_vRMvUbp5";

const API_URL =
  SUPABASE_URL + "/functions/v1/virgo-line-shift";

const statusEl = document.getElementById("status");
const linkSection = document.getElementById("linkSection");
const pendingSection = document.getElementById("pendingSection");
const shiftSection = document.getElementById("shiftSection");
const castNameInput = document.getElementById("castName");
const linkButton = document.getElementById("linkButton");
const linkResult = document.getElementById("linkResult");
const pendingName = document.getElementById("pendingName");
const checkButton = document.getElementById("checkButton");
const weekEl = document.getElementById("week");
const submitBtn = document.getElementById("submit");
const resultEl = document.getElementById("result");
const savedNoticeEl = document.getElementById("savedNotice");

const choices = [
  "21:00",
  "21:30",
  "22:00",
  "予定",
  "△",
  "同伴",
  "休み"
];

const weekdays = [
  "日", "月", "火", "水", "木", "金", "土"
];

const dates = [];

let sending = false;
let ready = false;
let hasSavedShifts = false;
let loadedValues = "";
let checking = false;
let requesting = false;

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function defaultDouhan() {
  return {
    arrival_time: "未定",
    keep_bottle: "不明",
    neck_name: "",
    brand: "",
    notes: ""
  };
}

function makeWeek() {
  const today = new Date();
  const daysUntilNextMonday =
    (8 - today.getDay()) % 7 || 7;

  const monday = new Date(
    today.getFullYear(),
    today.getMonth(),
    today.getDate() + daysUntilNextMonday,
    12
  );

  for (let i = 0; i < 6; i++) {
    const date = new Date(
      monday.getFullYear(),
      monday.getMonth(),
      monday.getDate() + i,
      12
    );

    dates.push(formatDate(date));

    const div = document.createElement("div");
    div.className = "day";

    const label = document.createElement("label");
    label.htmlFor = "shift" + i;
    label.textContent =
      `${date.getMonth() + 1}/${date.getDate()}` +
      `（${weekdays[date.getDay()]}）`;

    const select = document.createElement("select");
    select.id = "shift" + i;
    select.disabled = true;

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "選択してください";
    select.appendChild(placeholder);

    choices.forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });

    const detail = document.createElement("div");
    detail.id = "douhan" + i;
    detail.className = "douhan-details hidden";

    detail.innerHTML = `
      <div class="douhan-title">同伴詳細</div>

      <label for="arrival${i}">入店予定時間</label>
      <select id="arrival${i}">
        <option value="未定">未定</option>
        <option value="21:00">21:00</option>
        <option value="21:30">21:30</option>
        <option value="22:00">22:00</option>
      </select>

      <label for="keep${i}">キープボトル</label>
      <select id="keep${i}">
        <option value="不明">不明</option>
        <option value="あり">あり</option>
        <option value="なし">なし</option>
      </select>

      <div id="bottleExtra${i}" class="hidden">
        <label for="neck${i}">ネック名</label>
        <input
          id="neck${i}"
          type="text"
          maxlength="100"
          placeholder="例：山田様"
        >

        <label for="brand${i}">
          銘柄（焼酎・ウイスキーなど）
        </label>
        <input
          id="brand${i}"
          type="text"
          maxlength="100"
          placeholder="例：吉四六、白州"
        >
      </div>

      <label for="notes${i}">その他・備考（任意）</label>
      <input
        id="notes${i}"
        type="text"
        maxlength="300"
        placeholder="例：お客様2名、時間変更の可能性あり"
      >

      <div class="douhan-hint">
        キープボトルが「あり」の場合だけ、
        ネック名・銘柄を入力できます。
      </div>
    `;

    select.addEventListener(
      "change",
      () => updateDouhanVisibility(i)
    );

    detail.querySelector("#keep" + i).addEventListener(
      "change",
      () => updateDouhanVisibility(i)
    );

    div.appendChild(label);
    div.appendChild(select);
    div.appendChild(detail);
    weekEl.appendChild(div);
  }
}

function updateDouhanVisibility(i) {
  const time =
    document.getElementById("shift" + i).value;

  const keep =
    document.getElementById("keep" + i).value;

  const isDouhan = time === "同伴";

  document.getElementById("douhan" + i)
    .classList.toggle("hidden", !isDouhan);

  document.getElementById("bottleExtra" + i)
    .classList.toggle(
      "hidden",
      !isDouhan || keep !== "あり"
    );
}

function setDouhanValues(i, details) {
  const d = details || defaultDouhan();

  const arrivalOptions = [
    "未定", "21:00", "21:30", "22:00"
  ];

  const keepOptions = [
    "あり", "なし", "不明"
  ];

  document.getElementById("arrival" + i).value =
    arrivalOptions.includes(d.arrival_time)
      ? d.arrival_time
      : "未定";

  document.getElementById("keep" + i).value =
    keepOptions.includes(d.keep_bottle)
      ? d.keep_bottle
      : "不明";

  document.getElementById("neck" + i).value =
    d.neck_name || "";

  document.getElementById("brand" + i).value =
    d.brand || "";

  document.getElementById("notes" + i).value =
    d.notes || "";

  updateDouhanVisibility(i);
}

function getDouhanValues(i) {
  const keep =
    document.getElementById("keep" + i).value;

  return {
    arrival_time:
      document.getElementById("arrival" + i).value,

    keep_bottle: keep,

    neck_name:
      keep === "あり"
        ? document.getElementById("neck" + i).value.trim()
        : "",

    brand:
      keep === "あり"
        ? document.getElementById("brand" + i).value.trim()
        : "",

    notes:
      document.getElementById("notes" + i).value.trim()
  };
}

function showSection(section) {
  linkSection.classList.add("hidden");
  pendingSection.classList.add("hidden");
  shiftSection.classList.add("hidden");

  if (section) {
    section.classList.remove("hidden");
  }
}

function setControlsEnabled(enabled) {
  ready = enabled;

  dates.forEach((_, i) => {
    document.getElementById("shift" + i).disabled =
      !enabled;

    [
      "arrival",
      "keep",
      "neck",
      "brand",
      "notes"
    ].forEach(prefix => {
      document.getElementById(prefix + i).disabled =
        !enabled;
    });
  });

  submitBtn.disabled = !enabled || sending;

  if (!sending) {
    submitBtn.textContent = hasSavedShifts
      ? "変更したシフトを再提出する"
      : "シフトを提出する";
  }
}

function getShifts() {
  return dates.map((date, i) => {
    const time =
      document.getElementById("shift" + i).value;

    return {
      date,
      time,
      ...(time === "同伴"
        ? { douhan: getDouhanValues(i) }
        : {})
    };
  });
}

function snapshot(shifts) {
  return JSON.stringify(shifts);
}

function showResult(message, success) {
  resultEl.textContent = message;
  resultEl.className = success ? "success" : "error";
}

function showLinkResult(message, success) {
  linkResult.textContent = message;
  linkResult.className = success ? "success" : "error";
}

function getIdToken() {
  const idToken = liff.getIDToken();

  if (!idToken) {
    throw new Error(
      "LINE認証情報を取得できませんでした"
    );
  }

  return idToken;
}

async function callApi(body) {
  const controller = new AbortController();

  const timeout = setTimeout(() => {
    controller.abort();
  }, 20000);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLISHABLE_KEY
      },
      body: JSON.stringify(body),
      signal: controller.signal
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(
        result.message || "通信に失敗しました"
      );
    }

    return result;

  } finally {
    clearTimeout(timeout);
  }
}

async function loadPreviousShifts() {
  const idToken = getIdToken();

  statusEl.textContent =
    "前回のシフトを読み込んでいます...";

  const result = await callApi({
    action: "load",
    idToken,
    week: dates[0]
  });

  const savedShifts = result.shifts;

  if (!Array.isArray(savedShifts)) {
    throw new Error(
      "シフトの読み込み結果が不正です"
    );
  }

  const savedMap = new Map();

  for (const shift of savedShifts) {
    if (
      !shift ||
      !dates.includes(shift.date) ||
      !choices.includes(shift.time) ||
      savedMap.has(shift.date)
    ) {
      throw new Error(
        "保存済みシフトに不正なデータがあります"
      );
    }

    savedMap.set(shift.date, shift);
  }

  hasSavedShifts = savedMap.size > 0;

  dates.forEach((date, i) => {
    const select =
      document.getElementById("shift" + i);

    const saved = savedMap.get(date);

    select.value = saved?.time || "";

    setDouhanValues(i, saved?.douhan);
  });

  loadedValues = snapshot(getShifts());

  if (hasSavedShifts) {
    savedNoticeEl.style.display = "block";

    if (savedMap.size === 6) {
      savedNoticeEl.textContent =
        "前回提出したシフトを表示しています。" +
        "変更したい日だけ修正して再提出できます。";
    } else {
      savedNoticeEl.textContent =
        "保存済みのシフトを一部読み込みました。" +
        "未入力の日を選択してから提出してください。";
    }
  } else {
    savedNoticeEl.style.display = "none";
  }

  return result;
}

async function openShiftScreen() {
  showSection(null);
  setControlsEnabled(false);

  const result = await loadPreviousShifts();

  statusEl.textContent =
    "LINE認証済み：" + result.castName;

  showSection(shiftSection);
  setControlsEnabled(true);
}

async function checkLinkStatus() {
  if (checking) return;

  checking = true;
  checkButton.disabled = true;
  checkButton.textContent = "確認中...";

  try {
    const result = await callApi({
      action: "link_status",
      idToken: getIdToken()
    });

    if (result.linkStatus === "linked") {
      await openShiftScreen();
      return;
    }

    setControlsEnabled(false);

    if (result.linkStatus === "pending") {
      pendingName.textContent =
        result.requestedName || "確認中";

      statusEl.textContent =
        "LINE連携：管理者の承認待ち";

      showSection(pendingSection);
      return;
    }

    if (result.linkStatus === "unlinked") {
      statusEl.textContent =
        "初回のLINE連携が必要です";

      showSection(linkSection);
      return;
    }

    throw new Error(
      "LINE連携状態を確認できませんでした"
    );

  } catch (error) {
    statusEl.textContent =
      "確認エラー：" + error.message;

    showSection(pendingSection);
    pendingName.textContent = "確認できません";

  } finally {
    checking = false;
    checkButton.disabled = false;
    checkButton.textContent =
      "承認状況を確認する";
  }
}

async function requestLink() {
  if (requesting) return;

  const castName = castNameInput.value
    .trim()
    .normalize("NFKC");

  if (!castName || castName.length > 60) {
    showLinkResult(
      "キャスト名を正しく入力してください。",
      false
    );
    return;
  }

  if (!confirm(
    "以下のキャスト名でLINE連携を申請しますか？\n\n" +
    castName
  )) {
    return;
  }

  requesting = true;
  linkButton.disabled = true;
  linkButton.textContent = "申請中...";
  showLinkResult("申請しています...", true);

  try {
    const result = await callApi({
      action: "link_request",
      idToken: getIdToken(),
      castName
    });

    if (result.linkStatus === "linked") {
      await openShiftScreen();
      return;
    }

    if (result.linkStatus !== "pending") {
      throw new Error(
        "申請状況を確認できませんでした"
      );
    }

    pendingName.textContent =
      result.requestedName || castName;

    statusEl.textContent =
      "LINE連携：管理者の承認待ち";

    showSection(pendingSection);

  } catch (error) {
    showLinkResult(
      "LINE連携を申請できませんでした。\n" +
      error.message,
      false
    );

  } finally {
    requesting = false;
    linkButton.disabled = false;
    linkButton.textContent =
      "LINE連携を申請する";
  }
}

async function start() {
  makeWeek();

  try {
    await Promise.race([
      liff.init({ liffId: LIFF_ID }),
      new Promise((_, reject) => {
        setTimeout(() => {
          reject(new Error("認証タイムアウト"));
        }, 10000);
      })
    ]);

    if (!liff.isLoggedIn()) {
      statusEl.textContent =
        "LINEログインが必要です";

      liff.login({
        redirectUri: window.location.href
      });

      return;
    }

    getIdToken();
    await checkLinkStatus();

  } catch (error) {
    statusEl.textContent =
      "読み込みエラー：" + error.message;

    showLinkResult(
      "画面を開き直してください。",
      false
    );

    setControlsEnabled(false);
  }
}

async function submitShifts() {
  if (sending || !ready) return;

  const shifts = getShifts();

  if (shifts.some(s => !s.time)) {
    showResult(
      "月曜日から土曜日まで、6日分すべて選択してください。",
      false
    );
    return;
  }

  const unchanged =
    hasSavedShifts &&
    snapshot(shifts) === loadedValues;

  if (unchanged) {
    showResult(
      "前回のシフトから変更されていません。",
      false
    );
    return;
  }

  const summary = shifts.map(s => {
    if (s.time !== "同伴") {
      return s.date + "：" + s.time;
    }

    const d = s.douhan;

    return (
      s.date + "：同伴" +
      "\n  入店予定：" + d.arrival_time +
      "\n  キープボトル：" + d.keep_bottle +
      (d.keep_bottle === "あり"
        ? "\n  ネック名：" + (d.neck_name || "未入力") +
          "\n  銘柄：" + (d.brand || "未入力")
        : "") +
      (d.notes
        ? "\n  備考：" + d.notes
        : "")
    );
  }).join("\n\n");

  if (!confirm(
    "この内容でシフトを提出しますか？\n\n" +
    summary
  )) {
    return;
  }

  let idToken;

  try {
    idToken = getIdToken();
  } catch (error) {
    showResult(error.message, false);
    return;
  }

  sending = true;
  submitBtn.disabled = true;
  submitBtn.textContent = "送信中...";
  showResult("Supabaseに保存しています...", true);

  try {
    const result = await callApi({
      action: "save",
      idToken,
      shifts
    });

    hasSavedShifts = true;
    loadedValues = snapshot(shifts);

    savedNoticeEl.style.display = "block";
    savedNoticeEl.textContent =
      "保存済みのシフトを表示しています。" +
      "変更したい日だけ修正して再提出できます。";

    showResult(
      "シフト提出完了！\n\n" +
      "キャスト：" + result.castName + "\n" +
      "6日分を保存しました。\n\n" +
      summary,
      true
    );

  } catch (error) {
    showResult(
      "シフトを保存できませんでした。\n" +
      error.message,
      false
    );

  } finally {
    sending = false;
    setControlsEnabled(true);
  }
}

linkButton.addEventListener(
  "click",
  requestLink
);

checkButton.addEventListener(
  "click",
  checkLinkStatus
);

submitBtn.addEventListener(
  "click",
  submitShifts
);

start();
</script>

</body>
</html>
