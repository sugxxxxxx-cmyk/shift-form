
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シフト一覧 | Virgo</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f4f6fa;color:#202b3a;
 font-family:-apple-system,BlinkMacSystemFont,sans-serif
}
header{background:#131c2d;color:white;padding:17px 16px}
header h1{font-size:20px;margin:0}
header small{color:#b9c5d5;font-size:11px}
nav{display:flex;background:white;border-bottom:1px solid #e2e7ef}
nav a{
 flex:1;text-align:center;text-decoration:none;
 color:#667085;padding:15px 4px;font-size:13px;font-weight:bold
}
nav a.active{color:#087a4a;border-bottom:3px solid #087a4a}
main{max-width:1100px;margin:auto}
.week{
 display:flex;align-items:center;justify-content:space-between;
 background:white;padding:14px 10px;gap:8px
}
.week strong{font-size:17px}
button{
 border:1px solid #dce2eb;background:white;
 border-radius:9px;padding:11px;cursor:pointer;font-size:14px
}
.arrow{font-size:19px;width:44px}
.controls{display:flex;gap:8px;padding:12px}
input{
 width:100%;border:1px solid #dce2eb;
 border-radius:10px;padding:13px;font-size:16px
}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;padding:0 12px 12px
}
.stat{
 background:white;border-radius:11px;
 padding:13px 5px;text-align:center
}
.stat strong{display:block;font-size:23px}
.stat small{font-size:11px;color:#667085}
.table-wrap{
 overflow-x:auto;background:white;
 border-top:1px solid #e5e9ef
}
table{
 border-collapse:separate;border-spacing:0;
 width:max-content;min-width:100%
}
th,td{
 border-right:1px solid #e6e9ef;
 border-bottom:1px solid #e6e9ef;
 text-align:center;min-width:88px;height:52px;padding:0
}
thead th{
 background:#edf1f7;height:62px;font-size:13px;
 position:sticky;top:0;z-index:2
}
th:first-child,td:first-child{
 position:sticky;left:0;
 min-width:112px;max-width:112px;
 background:white;z-index:3;
 text-align:left;padding:0 10px;
 font-weight:600;font-size:13px
}
thead th:first-child{background:#edf1f7;z-index:4}
.count{
 display:block;font-size:12px;
 color:#16804c;margin-top:5px
}
.cell{
 display:flex;align-items:center;justify-content:center;
 width:calc(100% - 6px);height:43px;margin:3px;
 border:1px solid transparent;border-radius:6px;
 font-size:13px;font-weight:bold;cursor:pointer
}
.cell:hover{border-color:#087a4a}
.work{background:#d8f8e5;color:#087a3f}
.off{background:#f0f1f4;color:#9299a5}
.missing{background:#ffe3e5;color:#d33b48}
.legend{
 display:flex;flex-wrap:wrap;gap:15px;
 padding:17px;font-size:12px;color:#566171
}
.legend i{
 display:inline-block;width:13px;height:13px;
 border-radius:3px;vertical-align:middle;margin-right:4px
}
.note{
 font-size:12px;color:#737e8e;
 padding:0 16px 24px;line-height:1.7
}
.overlay{
 display:none;position:fixed;inset:0;
 background:rgba(15,23,42,.55);z-index:100;
 align-items:center;justify-content:center;padding:16px
}
.overlay.open{display:flex}
.modal{
 background:white;border-radius:16px;padding:20px;
 width:100%;max-width:380px;
 box-shadow:0 20px 60px rgba(0,0,0,.2)
}
.modal h2{font-size:19px;margin:0 0 7px}
.modal p{font-size:13px;color:#667085;margin:0 0 16px}
.options{
 display:grid;grid-template-columns:repeat(2,1fr);gap:9px
}
.options button{
 padding:15px 6px;font-size:15px;font-weight:bold
}
.options button.selected{
 background:#087a4a;color:white;border-color:#087a4a
}
.options .rest{background:#f0f1f4}
.options .none{background:#ffe3e5;color:#b42332}
.close{width:100%;margin-top:14px;background:#f4f6fa}
@media(max-width:600px){
 .week strong{font-size:15px}
}
</style>
</head>
<body>

<header>
 <h1>キャストシフト</h1>
 <small>Virgo Shift Manager ・ DEMO</small>
</header>

<nav>
 <a href="shift-view.html" class="active">シフト一覧</a>
 <a href="admin.html">シフト管理</a>
 <a href="staff.html">スタッフ管理</a>
</nav>

<main>
 <div class="week">
  <button class="arrow" onclick="changeWeek(-1)">◀</button>
  <div style="text-align:center">
   <strong id="weekTitle"></strong>
   <div>
    <button onclick="goThisWeek()"
      style="padding:5px 12px;margin-top:5px;font-size:12px">
      今週に戻る
    </button>
   </div>
  </div>
  <button class="arrow" onclick="changeWeek(1)">▶</button>
 </div>

 <div class="controls">
  <input id="search" placeholder="キャスト名で検索"
    oninput="render()">
 </div>

 <div class="stats">
  <div class="stat">
   <strong id="totalCount">0</strong>
   <small>キャスト総数</small>
  </div>
  <div class="stat">
   <strong id="submittedCount">0</strong>
   <small>提出済み</small>
  </div>
  <div class="stat">
   <strong id="missingCount">0</strong>
   <small>未提出・未入力</small>
  </div>
 </div>

 <div class="table-wrap">
  <table>
   <thead id="thead"></thead>
   <tbody id="tbody"></tbody>
  </table>
 </div>

 <div class="legend">
  <span><i style="background:#d8f8e5"></i>出勤予定</span>
  <span><i style="background:#f0f1f4"></i>休み</span>
  <span><i style="background:#ffe3e5"></i>未提出</span>
 </div>

 <p class="note">
  ※ マスをタップするとシフトを変更できます。<br>
  ※ 管理者が変更したマスは、デモ提出データより優先されます。<br>
  ※ 同じブラウザのシフト管理画面と変更内容を共有します。<br>
  ※ 現在はデモです。実際のLINE提出データには接続していません。
 </p>
</main>

<div class="overlay" id="overlay" onclick="closeOutside(event)">
 <div class="modal" role="dialog" aria-modal="true"
   aria-labelledby="modalTitle">
  <h2 id="modalTitle">シフト変更</h2>
  <p id="modalInfo"></p>
  <div class="options" id="options"></div>
  <button class="close" onclick="closeModal()">キャンセル</button>
 </div>
</div>

<script>
const initialNames=[
 'さくら','花子','美咲','あかり','ゆい','りな',
 'みお','れいな','なな','ひなた','あおい','あすか'
];

const samples=[
 ['21:00','21:00','休み','22:00','21:00','21:30'],
 ['休み','21:30','21:00','21:00','22:00','21:00'],
 ['22:00','休み','21:00','21:30','21:00','休み'],
 null,
 ['21:30','22:00','休み','21:00','21:00','21:30'],
 null,
 ['21:00','21:00','21:30','休み','22:00','21:00'],
 ['休み','22:00','21:00','21:30','21:00','22:00'],
 null,
 ['21:00','21:30','休み','21:00','21:00','21:00'],
 ['21:00','休み','22:30','21:00','21:30','休み'],
 ['22:00','21:00','21:30','休み','21:00','22:30']
];

const weekdays=['月','火','水','木','金','土'];
const times=[
 '21:00','21:30','22:00','22:30',
 '23:00','休み','未提出'
];

let weekOffset=0;
let editing=null;

function mondayOfWeek(offset){
 const d=new Date();
 d.setHours(12,0,0,0);
 d.setDate(d.getDate()-(d.getDay()+6)%7+offset*7);
 return d;
}

function dateKey(d){
 return d.getFullYear()+'-'+
 String(d.getMonth()+1).padStart(2,'0')+'-'+
 String(d.getDate()).padStart(2,'0');
}

function weekKey(){
 return 'virgo_demo_shifts_'+dateKey(mondayOfWeek(weekOffset));
}

// デモ提出データ専用の保存場所
function submissionKey(){
 return 'virgo_demo_submissions_'+dateKey(mondayOfWeek(weekOffset));
}

function dateText(d){
 return (d.getMonth()+1)+'/'+d.getDate();
}

function changeWeek(n){
 weekOffset+=n;
 render();
}

function goThisWeek(){
 weekOffset=0;
 render();
}

function readJSON(key,fallback){
 try{
  const value=JSON.parse(localStorage.getItem(key));
  if(value!==null && typeof value==='object')return value;
 }catch(e){}
 return fallback;
}

function getCasts(){
 const saved=readJSON('virgo_demo_casts',null);
 if(Array.isArray(saved))return saved;

 return initialNames.map((name,i)=>({
  id:'initial_'+i,
  name,
  status:i===0?'連携済み':'未連携'
 }));
}

function castId(cast){
 return cast.id||'name_'+cast.name;
}

function getData(){
 const data=readJSON(weekKey(),{});
 return Array.isArray(data)?{}:data;
}

function getSubmissions(){
 const data=readJSON(submissionKey(),{});
 return Array.isArray(data)?{}:data;
}

function normalizeDays(days){
 if(!Array.isArray(days))return null;
 return Array.from({length:6},(_,i)=>{
  const value=days[i];
  return times.includes(value)?value:'未提出';
 });
}

// 管理者変更 > デモ提出 > サンプルの順で反映
function getShift(cast,data,submissions){
 const id=castId(cast);
 const manual=data[id];
 const submitted=submissions[id];

 const sampleIndex=initialNames.indexOf(cast.name);
 const sample=sampleIndex>=0?samples[sampleIndex]:null;

 const base=
  normalizeDays(submitted && submitted.days) ||
  normalizeDays(sample) ||
  Array(6).fill('未提出');

 if(manual && Array.isArray(manual.days)){
  const saved=normalizeDays(manual.days);

  // 新方式：変更した曜日だけ優先
  if(Array.isArray(manual.manualDays)){
   return base.map((value,i)=>
    manual.manualDays.includes(i)?saved[i]:value
   );
  }

  // 旧方式の保存データも引き続き表示
  return saved;
 }

 return base;
}

function hasSubmission(cast,submissions){
 const entry=submissions[castId(cast)];
 return !!(entry && normalizeDays(entry.days));
}

function render(){
 const monday=mondayOfWeek(weekOffset);
 const saturday=new Date(monday);
 saturday.setDate(monday.getDate()+5);

 document.getElementById('weekTitle').textContent=
  dateText(monday)+' 〜 '+dateText(saturday);

 const casts=getCasts();
 const data=getData();
 const submissions=getSubmissions();

 const rows=casts.map(cast=>({
  cast,
  shift:getShift(cast,data,submissions)
 }));

 const submitted=casts.filter(cast=>
  hasSubmission(cast,submissions)
 ).length;

 document.getElementById('totalCount').textContent=casts.length;
 document.getElementById('submittedCount').textContent=submitted;
 document.getElementById('missingCount').textContent=
  casts.length-submitted;

 let head='<tr><th>キャスト</th>';

 for(let i=0;i<6;i++){
  const date=new Date(monday);
  date.setDate(monday.getDate()+i);

  const count=rows.filter(row=>{
   const value=row.shift[i];
   return value &&
    value!=='休み' &&
    value!=='未提出' &&
    value!=='未';
  }).length;

  head+='<th>'+dateText(date)+'('+weekdays[i]+')'+
   '<span class="count">出勤 '+count+'人</span></th>';
 }

 head+='</tr>';
 document.getElementById('thead').innerHTML=head;

 const query=document.getElementById('search').value.trim();
 const tbody=document.getElementById('tbody');
 tbody.innerHTML='';

 let visible=0;

 rows.forEach(row=>{
  if(!row.cast.name.includes(query))return;
  visible++;

  const tr=document.createElement('tr');
  const nameCell=document.createElement('td');
  nameCell.textContent=row.cast.name;
  tr.appendChild(nameCell);

  for(let i=0;i<6;i++){
   const td=document.createElement('td');
   const button=document.createElement('button');

   const value=row.shift[i]||'未提出';
   const cls=value==='休み'?'off':
    value==='未提出'||value==='未'?'missing':'work';

   button.className='cell '+cls;
   button.textContent=value==='未提出'?'未':value;
   button.setAttribute(
    'aria-label',
    row.cast.name+' '+weekdays[i]+'曜日 '+value+' 編集'
   );

   button.onclick=()=>openModal(castId(row.cast),i);

   td.appendChild(button);
   tr.appendChild(td);
  }

  tbody.appendChild(tr);
 });

 if(!visible){
  const tr=document.createElement('tr');
  const td=document.createElement('td');
  td.colSpan=7;
  td.textContent='該当するキャストがいません';
  tr.appendChild(td);
  tbody.appendChild(tr);
 }
}

function openModal(id,day){
 const cast=getCasts().find(c=>castId(c)===id);
 if(!cast)return;

 const shift=getShift(cast,getData(),getSubmissions());
 const current=shift[day];

 editing={id,day};

 document.getElementById('modalTitle').textContent=
  cast.name+' のシフト変更';

 document.getElementById('modalInfo').textContent=
  weekdays[day]+'曜日　現在：'+current;

 const options=document.getElementById('options');
 options.innerHTML='';

 times.forEach(time=>{
  const btn=document.createElement('button');
  btn.textContent=time;

  if(time===current)btn.classList.add('selected');
  if(time==='休み')btn.classList.add('rest');
  if(time==='未提出')btn.classList.add('none');

  btn.onclick=()=>saveShift(time);
  options.appendChild(btn);
 });

 document.getElementById('overlay').classList.add('open');
}

function saveShift(value){
 if(!editing)return;

 const cast=getCasts().find(c=>
  castId(c)===editing.id
 );

 if(!cast){
  closeModal();
  return;
 }

 const data=getData();
 const submissions=getSubmissions();
 const current=getShift(cast,data,submissions);

 const days=[...current];
 days[editing.day]=value;

 const old=data[editing.id];

 // 以前の管理者入力は保護する
 const manualDays=
  old && Array.isArray(old.manualDays)
   ? [...old.manualDays]
   : old && Array.isArray(old.days)
     ? [0,1,2,3,4,5]
     : [];

 if(!manualDays.includes(editing.day)){
  manualDays.push(editing.day);
 }

 data[editing.id]={
  days,
  manualDays,
  source:'manual',
  updatedAt:new Date().toISOString()
 };

 try{
  localStorage.setItem(weekKey(),JSON.stringify(data));
  closeModal();
  render();
 }catch(error){
  alert('保存できませんでした：'+error.message);
 }
}

function closeModal(){
 document.getElementById('overlay').classList.remove('open');
 editing=null;
}

function closeOutside(event){
 if(event.target.id==='overlay')closeModal();
}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeModal();
});

// 同じブラウザの別タブで変更された場合に反映
window.addEventListener('storage',render);
window.addEventListener('pageshow',render);

// デモデータの変化を定期的に確認
let lastSnapshot='';

function refreshIfChanged(){
 const snapshot=JSON.stringify({
  casts:localStorage.getItem('virgo_demo_casts'),
  shifts:localStorage.getItem(weekKey()),
  submissions:localStorage.getItem(submissionKey())
 });

 if(snapshot!==lastSnapshot){
  lastSnapshot=snapshot;
  if(!editing)render();
 }
}

setInterval(refreshIfChanged,10000);
render();
</script>
</body>
</html>
