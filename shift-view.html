
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シフト一覧 | Virgo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#202b3a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:#131c2d;color:white;padding:17px 16px}
header h1{font-size:20px;margin:0}
header small{color:#b9c5d5;font-size:11px}
nav{display:flex;background:white;border-bottom:1px solid #e2e7ef}
nav a{flex:1;text-align:center;text-decoration:none;color:#667085;padding:15px 4px;font-size:13px;font-weight:bold}
nav a.active{color:#087a4a;border-bottom:3px solid #087a4a}
main{max-width:1100px;margin:auto}
.week{display:flex;align-items:center;justify-content:space-between;background:white;padding:14px 10px;gap:8px}
.week strong{font-size:17px}
button{border:1px solid #dce2eb;background:white;border-radius:9px;padding:11px;cursor:pointer;font-size:14px}
.arrow{font-size:19px;width:44px}
.controls{display:flex;gap:8px;padding:12px}
input{width:100%;border:1px solid #dce2eb;border-radius:10px;padding:13px;font-size:16px}
.sync{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 12px;font-size:12px;color:#667085}
.sync button{padding:8px 12px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 12px}
.stat{background:white;border-radius:11px;padding:13px 5px;text-align:center}
.stat strong{display:block;font-size:23px}
.stat small{font-size:11px;color:#667085}
.table-wrap{overflow-x:auto;background:white;border-top:1px solid #e5e9ef}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{border-right:1px solid #e6e9ef;border-bottom:1px solid #e6e9ef;text-align:center;min-width:88px;height:52px;padding:0}
thead th{background:#edf1f7;height:62px;font-size:13px;position:sticky;top:0;z-index:2}
th:first-child,td:first-child{position:sticky;left:0;min-width:112px;max-width:112px;background:white;z-index:3;text-align:left;padding:0 10px;font-weight:600;font-size:13px}
thead th:first-child{background:#edf1f7;z-index:4}
.count{display:block;font-size:12px;color:#16804c;margin-top:5px}
.cell{display:flex;align-items:center;justify-content:center;width:calc(100% - 6px);height:43px;margin:3px;border:1px solid transparent;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer}
.cell:hover{border-color:#087a4a}
.work{background:#d8f8e5;color:#087a3f}
.off{background:#f0f1f4;color:#9299a5}
.missing{background:#ffe3e5;color:#d33b48}
.legend{display:flex;flex-wrap:wrap;gap:15px;padding:17px;font-size:12px;color:#566171}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:middle;margin-right:4px}
.note{font-size:12px;color:#737e8e;padding:0 16px 24px;line-height:1.7}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:white;border-radius:16px;padding:20px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:19px;margin:0 0 7px}
.modal p{font-size:13px;color:#667085;margin:0 0 16px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.options button{padding:15px 6px;font-size:15px;font-weight:bold}
.options button.selected{background:#087a4a;color:white;border-color:#087a4a}
.options .rest{background:#f0f1f4}
.options .none{background:#ffe3e5;color:#b42332}
.close{width:100%;margin-top:14px;background:#f4f6fa}
@media(max-width:600px){.week strong{font-size:15px}}
</style>
</head>
<body>

<header>
 <h1>キャストシフト</h1>
 <small>Virgo Shift Manager ・ TEST</small>
</header>

<nav>
 <a href="shift-view.html" class="active">シフト一覧</a>
 <a href="admin.html">シフト管理</a>
 <a href="staff.html">スタッフ管理</a>
</nav>

<main>
 <div class="week">
  <button class="arrow" onclick="changeWeek(-1)">◀</button>
  <div style="text-align:center">
   <strong id="weekTitle"></strong>
   <div>
    <button onclick="goThisWeek()" style="padding:5px 12px;margin-top:5px;font-size:12px">
     今週に戻る
    </button>
   </div>
  </div>
  <button class="arrow" onclick="changeWeek(1)">▶</button>
 </div>

 <div class="controls">
  <input id="search" placeholder="キャスト名で検索" oninput="render()">
 </div>

 <div class="sync">
  <span id="syncStatus">スプレッドシートに接続中...</span>
  <button onclick="loadRemote()">更新する ↻</button>
 </div>

 <div class="stats">
  <div class="stat">
   <strong id="totalCount">0</strong>
   <small>キャスト総数</small>
  </div>
  <div class="stat">
   <strong id="submittedCount">0</strong>
   <small>提出済み</small>
  </div>
  <div class="stat">
   <strong id="missingCount">0</strong>
   <small>未提出</small>
  </div>
 </div>

 <div class="table-wrap">
  <table>
   <thead id="thead"></thead>
   <tbody id="tbody"></tbody>
  </table>
 </div>

 <div class="legend">
  <span><i style="background:#d8f8e5"></i>出勤予定</span>
  <span><i style="background:#f0f1f4"></i>休み</span>
  <span><i style="background:#ffe3e5"></i>未提出</span>
 </div>

 <p class="note">
  ※ LINE提出内容はスプレッドシートから読み込みます。<br>
  ※ 約30秒ごとに更新を確認します。<br>
  ※ マスをタップすると、このブラウザ内でシフトを変更できます。<br>
  ※ 管理画面での変更は、まだスプレッドシートには書き戻しません。<br>
  ※ テスト専用です。実在するキャスト情報は登録しないでください。
 </p>
</main>

<div class="overlay" id="overlay" onclick="closeOutside(event)">
 <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <h2 id="modalTitle">シフト変更</h2>
  <p id="modalInfo"></p>
  <div class="options" id="options"></div>
  <button class="close" onclick="closeModal()">キャンセル</button>
 </div>
</div>

<script>
const API_URL =
 'https://script.google.com/macros/s/AKfycbzp3OJOz1hJfg-9fVt2FHGsDj1aCqGgww4mzQzgBRbulxp_kE2FQH8B-EkDK9AeyZ42/exec';

const weekdays=['月','火','水','木','金','土'];
const times=['21:00','21:30','22:00','22:30','23:00','休み','未提出'];

let weekOffset=0;
let editing=null;
let remoteCasts=[];
let loadedWeek='';
let requestNumber=0;

function mondayOfWeek(offset){
 const d=new Date();
 d.setHours(12,0,0,0);
 d.setDate(d.getDate()-(d.getDay()+6)%7+offset*7);
 return d;
}

function dateKey(d){
 return d.getFullYear()+'-'+
  String(d.getMonth()+1).padStart(2,'0')+'-'+
  String(d.getDate()).padStart(2,'0');
}

function weekKey(){
 return 'virgo_demo_shifts_'+dateKey(mondayOfWeek(weekOffset));
}

function dateText(d){
 return (d.getMonth()+1)+'/'+d.getDate();
}

function changeWeek(n){
 weekOffset+=n;
 remoteCasts=[];
 loadedWeek='';
 render();
 loadRemote();
}

function goThisWeek(){
 weekOffset=0;
 remoteCasts=[];
 loadedWeek='';
 render();
 loadRemote();
}

function getLocalData(){
 try{
  const value=JSON.parse(localStorage.getItem(weekKey()));
  if(value && !Array.isArray(value) && typeof value==='object'){
   return value;
  }
 }catch(e){}
 return {};
}

function getDays(cast){
 const base=Array.isArray(cast.days)
  ? [...cast.days]
  : Array(6).fill('未提出');

 const local=getLocalData()[cast.id];

 if(!local || !Array.isArray(local.days))return base;

 const manualDays=Array.isArray(local.manualDays)
  ? local.manualDays
  : [0,1,2,3,4,5];

 manualDays.forEach(i=>{
  if(i>=0 && i<6 && times.includes(local.days[i])){
   base[i]=local.days[i];
  }
 });

 return base;
}

function render(){
 const monday=mondayOfWeek(weekOffset);
 const saturday=new Date(monday);
 saturday.setDate(saturday.getDate()+5);

 document.getElementById('weekTitle').textContent=
  dateText(monday)+' 〜 '+dateText(saturday);

 const rows=remoteCasts.map(cast=>({
  cast,
  days:getDays(cast)
 }));

 const submitted=remoteCasts.filter(cast=>cast.submitted).length;

 document.getElementById('totalCount').textContent=remoteCasts.length;
 document.getElementById('submittedCount').textContent=submitted;
 document.getElementById('missingCount').textContent=
  remoteCasts.length-submitted;

 let head='<tr><th>キャスト</th>';

 for(let i=0;i<6;i++){
  const date=new Date(monday);
  date.setDate(date.getDate()+i);

  const count=rows.filter(row=>
   row.days[i] !== '休み' &&
   row.days[i] !== '未提出' &&
   row.days[i] !== '未' &&
   !!row.days[i]
  ).length;

  head+='<th>'+dateText(date)+'('+weekdays[i]+')'+
   '<span class="count">出勤 '+count+'人</span></th>';
 }

 head+='</tr>';
 document.getElementById('thead').innerHTML=head;

 const query=document.getElementById('search').value.trim();
 const tbody=document.getElementById('tbody');
 tbody.innerHTML='';

 let visible=0;

 rows.forEach(row=>{
  if(!String(row.cast.name).includes(query))return;
  visible++;

  const tr=document.createElement('tr');
  const nameCell=document.createElement('td');
  nameCell.textContent=row.cast.name;
  tr.appendChild(nameCell);

  for(let i=0;i<6;i++){
   const value=row.days[i]||'未提出';
   const td=document.createElement('td');
   const btn=document.createElement('button');

   btn.className='cell '+(
    value==='休み'?'off':
    value==='未提出'||value==='未'?'missing':'work'
   );

   btn.textContent=value==='未提出'?'未':value;
   btn.setAttribute(
    'aria-label',
    row.cast.name+' '+weekdays[i]+'曜日 '+value+' 編集'
   );
   btn.onclick=()=>openModal(row.cast.id,i);

   td.appendChild(btn);
   tr.appendChild(td);
  }

  tbody.appendChild(tr);
 });

 if(!visible){
  const tr=document.createElement('tr');
  const td=document.createElement('td');
  td.colSpan=7;
  td.style.padding='20px';
  td.textContent=loadedWeek
   ? '該当するキャストがいません'
   : 'シフトを読み込み中です';
  tr.appendChild(td);
  tbody.appendChild(tr);
 }
}

function openModal(id,day){
 const cast=remoteCasts.find(c=>c.id===id);
 if(!cast)return;

 const current=getDays(cast)[day]||'未提出';
 editing={id,day};

 document.getElementById('modalTitle').textContent=
  cast.name+' のシフト変更';

 document.getElementById('modalInfo').textContent=
  weekdays[day]+'曜日　現在：'+current;

 const options=document.getElementById('options');
 options.innerHTML='';

 times.forEach(time=>{
  const btn=document.createElement('button');
  btn.textContent=time;

  if(time===current)btn.classList.add('selected');
  if(time==='休み')btn.classList.add('rest');
  if(time==='未提出')btn.classList.add('none');

  btn.onclick=()=>saveShift(time);
  options.appendChild(btn);
 });

 document.getElementById('overlay').classList.add('open');
}

function saveShift(value){
 if(!editing)return;

 const cast=remoteCasts.find(c=>c.id===editing.id);
 if(!cast){
  closeModal();
  return;
 }

 const data=getLocalData();
 const old=data[editing.id];
 const days=getDays(cast);

 days[editing.day]=value;

 const manualDays=old && Array.isArray(old.manualDays)
  ? [...old.manualDays]
  : old && Array.isArray(old.days)
    ? [0,1,2,3,4,5]
    : [];

 if(!manualDays.includes(editing.day)){
  manualDays.push(editing.day);
 }

 data[editing.id]={
  days,
  manualDays,
  source:'manual',
  updatedAt:new Date().toISOString()
 };

 try{
  localStorage.setItem(weekKey(),JSON.stringify(data));
  closeModal();
  render();
 }catch(error){
  alert('保存できませんでした：'+error.message);
 }
}

function closeModal(){
 document.getElementById('overlay').classList.remove('open');
 editing=null;
}

function closeOutside(event){
 if(event.target.id==='overlay')closeModal();
}

function setStatus(message){
 document.getElementById('syncStatus').textContent=message;
}

// スプレッドシートからJSONPで取得
function loadRemote(){
 const week=dateKey(mondayOfWeek(weekOffset));
 const requestId=++requestNumber;
 const callbackName='virgoDemoCallback_'+requestId+'_'+Date.now();

 setStatus('スプレッドシートから読み込み中...');

 const script=document.createElement('script');
 let finished=false;

 function cleanup(){
  if(finished)return;
  finished=true;
  clearTimeout(timeoutId);
  script.remove();
  try{delete window[callbackName];}
  catch(e){window[callbackName]=undefined;}
 }

 window[callbackName]=function(result){
  cleanup();

  // 週を切り替えた後の古い結果は無視
  if(requestId!==requestNumber)return;
  if(week!==dateKey(mondayOfWeek(weekOffset)))return;

  if(
   !result ||
   result.success!==true ||
   result.week!==week ||
   !Array.isArray(result.casts)
  ){
   setStatus('取得できませんでした。更新ボタンで再試行してください');
   return;
  }

  remoteCasts=result.casts
   .filter(c=>
    c &&
    typeof c.id==='string' &&
    typeof c.name==='string' &&
    Array.isArray(c.days)
   )
   .map(c=>({
    id:c.id,
    name:c.name,
    days:c.days.slice(0,6),
    submitted:c.submitted===true
   }));

  loadedWeek=week;

  const now=new Date();
  setStatus(
   'スプレッドシートと接続済み ・ '+
   now.toLocaleTimeString('ja-JP',{
    hour:'2-digit',
    minute:'2-digit',
    second:'2-digit'
   })+' 更新'
  );

  render();
 };

 script.onerror=function(){
  cleanup();
  if(requestId===requestNumber){
   setStatus('接続エラー。APIのURLとデプロイを確認してください');
  }
 };

 const timeoutId=setTimeout(()=>{
  cleanup();
  if(requestId===requestNumber){
   setStatus('読み込みがタイムアウトしました。再試行してください');
  }
 },15000);

 script.src=API_URL+
  '?action=demoShiftView'+
  '&week='+encodeURIComponent(week)+
  '&callback='+encodeURIComponent(callbackName)+
  '&_='+Date.now();

 document.head.appendChild(script);
}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeModal();
});

window.addEventListener('storage',render);

window.addEventListener('pageshow',()=>{
 render();
 loadRemote();
});

// 30秒ごとにシートの更新を確認
setInterval(()=>{
 if(document.visibilityState==='visible'){
  loadRemote();
 }
},30000);

render();
loadRemote();
</script>
</body>
</html>
